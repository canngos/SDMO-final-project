[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "temperature-pqc-demo"
version = "0.1.0"
description = "Legacy edge-cloud temperature sensor baseline for a modernization project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.0",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8,<10",
  "pytest-cov",
  "ruff",
  "pip-audit",
  "starlette>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::ResourceWarning",
]
testpaths = ["tests"]
